{% if c.status == 'active' %}{% if c.days_left < 0 %}<span class="pill pill-danger">Expired</span>{% elif c.days_left <= 30 %}<span class="pill pill-warning">{{ c.days_left }}d left</span>{% else %}<span class="pill pill-success">Active</span>{% endif %}{% elif c.status == 'renewed' %}<span class="pill pill-brand">Renewed</span>{% elif c.status == 'lapsed' %}<span class="pill pill-danger">Lapsed</span>{% else %}<span class="pill pill-neutral">Cancelled</span>{% endif %}
