{% if stage == 'won' %}<span class="pill pill-success">{{ label }}</span>{% elif stage == 'lost' %}<span class="pill pill-neutral">{{ label }}</span>{% elif stage == 'qualified' or stage == 'proposal' or stage == 'negotiation' %}<span class="pill pill-brand">{{ label }}</span>{% elif stage == 'new' %}<span class="pill pill-info">{{ label }}</span>{% else %}<span class="pill pill-warning">{{ label }}</span>{% endif %}
