name: CI
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: Tests on PostgreSQL (RLS enforced)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_DB: quantumloop, POSTGRES_USER: quantum, POSTGRES_PASSWORD: quantum }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U quantum" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      # The suite runs as quantum_app, a plain role: superusers bypass row-level security.
      DATABASE_URL: postgres://quantum_app:quantum@localhost:5432/quantumloop
      REDIS_URL: redis://localhost:6379/0
      DJANGO_SECRET_KEY: ci-only-not-secret
      FIELD_ENCRYPTION_KEY: "N0a43uzRBkj-L4f6ZL0vWD4GLK6pZDvEbSk5IAOU7F8="
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - name: Create the non-superuser application role
        run: |
          psql postgres://quantum:quantum@localhost:5432/quantumloop -v ON_ERROR_STOP=1 -f docker/initdb/01-app-role.sql
      - run: pip install -r requirements.txt pip-audit
      - run: python manage.py check
      - name: Migrations are committed
        run: python manage.py makemigrations --check --dry-run
      - name: Tests (includes the raw-SQL cross-tenant check)
        run: pytest -p no:warnings -rs
      - name: Dependency vulnerability scan
        run: pip-audit -r requirements.txt --strict --desc on

  image:
    name: Build production image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: quantumloop-erp:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the image (deploy checks, static files, healthz)
        run: |
          docker run --rm -e DJANGO_DEBUG=0 -e DJANGO_SECRET_KEY=$(python3 -c "import secrets;print(secrets.token_urlsafe(48))") \
            -e FIELD_ENCRYPTION_KEY=N0a43uzRBkj-L4f6ZL0vWD4GLK6pZDvEbSk5IAOU7F8= -e DATABASE_URL=sqlite:////tmp/smoke.sqlite3 \
            -e DJANGO_ALLOWED_HOSTS=localhost -e SITE_URL=https://ci.example quantumloop-erp:ci check --deploy --fail-level ERROR
          docker run --rm --entrypoint python quantumloop-erp:ci -c "import pathlib;assert pathlib.Path('/app/staticfiles/staticfiles.json').exists(), 'manifest missing'; print('static ok')"
