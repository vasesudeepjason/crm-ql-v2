services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: quantumloop
      POSTGRES_USER: quantum
      POSTGRES_PASSWORD: quantum
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quantum -d quantumloop"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes:
  pgdata:
